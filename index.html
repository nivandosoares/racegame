<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Drive II - Mode 7 Prototype</title>
  <style>
    :root {
      --bg: #0b0e16;
      --panel: #111726;
      --text: #f2f2f2;
      --accent: #f5cf40;
      --danger: #ff4d5a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 10%, #1f2f57 0%, #11182f 45%, #080b14 100%);
      color: var(--text);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .game-shell {
      width: min(100vw, 1024px);
      aspect-ratio: 4 / 3;
      background: linear-gradient(180deg, #202a45 0%, #111726 100%);
      border: 4px solid #303c61;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #87b8ff;
    }

    .overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      font-size: clamp(12px, 2vw, 20px);
      letter-spacing: 1px;
    }

    .hud-chip {
      background: rgba(4, 6, 12, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
    }

    .help {
      font-size: clamp(10px, 1.5vw, 16px);
      color: #ddd;
      opacity: 0.92;
      background: rgba(4, 6, 12, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      max-width: 60%;
    }

    .crash {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(5, 5, 8, 0.72);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: clamp(18px, 2.6vw, 34px);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .crash.visible {
      display: grid;
    }

    .crash small {
      display: block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.45em;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="720" aria-label="Mode 7 racing prototype"></canvas>

    <div class="overlay">
      <div class="hud-row">
        <div class="hud-chip">Speed: <span id="speed">0</span> mph</div>
        <div class="hud-chip">Distance: <span id="distance">0.0</span> mi</div>
        <div class="hud-chip">Curve: <span id="curve">0.00</span></div>
      </div>
      <div class="help">Arrows / A-D steer, W-S throttle and brake, Space handbrake. R to restart after crash.</div>
    </div>

    <div id="crashScreen" class="crash">
      CRASHED
      <small>Press R to restart</small>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const speedEl = document.getElementById('speed');
    const distanceEl = document.getElementById('distance');
    const curveEl = document.getElementById('curve');
    const crashScreen = document.getElementById('crashScreen');

    const world = {
      segmentLength: 180,
      roadWidth: 1400,
      laneCount: 2,
      cameraDepth: 0.95,
      drawDistance: 240,
      horizonY: canvas.height * 0.44,
      rumbleLength: 3
    };

    const car = {
      x: 0,
      z: 0,
      speed: 0,
      maxSpeed: 420,
      accel: 145,
      braking: 260,
      friction: 72,
      offroadDrag: 220,
      steerStrength: 2.9,
      crashed: false
    };

    const state = {
      time: 0,
      distance: 0,
      keys: new Set(),
      segments: [],
      opponents: []
    };

    function createTrack() {
      const segments = [];
      const push = (count, curve = 0, hill = 0) => {
        for (let i = 0; i < count; i++) {
          segments.push({
            index: segments.length,
            curve,
            y: hill * i
          });
        }
      };

      push(80, 0, 0);
      push(80, 0.5, 0);
      push(60, 0.9, 0.06);
      push(90, -0.72, -0.03);
      push(70, -1.1, 0);
      push(100, 0.35, 0.02);
      push(80, 0, -0.07);
      push(120, 0.12, 0);

      return segments;
    }

    function seedOpponents() {
      const cars = [];
      for (let i = 0; i < 22; i++) {
        cars.push({
          z: (i + 8) * world.segmentLength * 10,
          x: (Math.random() * 2 - 1) * 0.75,
          speed: 180 + Math.random() * 140,
          color: `hsl(${Math.random() * 80 + 20}, 70%, 52%)`
        });
      }
      return cars;
    }

    function resetGame() {
      state.segments = createTrack();
      state.opponents = seedOpponents();
      state.time = 0;
      state.distance = 0;
      car.x = 0;
      car.z = 0;
      car.speed = 0;
      car.crashed = false;
      crashScreen.classList.remove('visible');
    }

    function trackLength() {
      return state.segments.length * world.segmentLength;
    }

    function findSegment(z) {
      const i = Math.floor(z / world.segmentLength) % state.segments.length;
      return state.segments[(i + state.segments.length) % state.segments.length];
    }

    function project(worldX, worldY, worldZ, cameraX, cameraY, cameraZ) {
      const dz = worldZ - cameraZ;
      const scale = world.cameraDepth / Math.max(1, dz);
      return {
        x: Math.round((1 + scale * (worldX - cameraX)) * canvas.width * 0.5),
        y: Math.round((1 - scale * (worldY - cameraY)) * canvas.height * 0.5),
        w: Math.round(scale * world.roadWidth * canvas.width * 0.5)
      };
    }

    function drawBackground(baseSegment) {
      const sky = ctx.createLinearGradient(0, 0, 0, world.horizonY);
      sky.addColorStop(0, '#2955c6');
      sky.addColorStop(1, '#90b4ff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, world.horizonY);

      const hillShift = Math.sin(baseSegment.index * 0.03) * 20;
      ctx.fillStyle = '#7e522d';
      ctx.beginPath();
      ctx.moveTo(0, world.horizonY + 25);
      for (let x = 0; x <= canvas.width; x += 40) {
        const y = world.horizonY + 42 + Math.sin((x + hillShift) * 0.016) * 24;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(canvas.width, world.horizonY + 140);
      ctx.lineTo(0, world.horizonY + 140);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#c9975e';
      ctx.fillRect(0, world.horizonY + 60, canvas.width, canvas.height - world.horizonY);
    }

    function drawSegment(x1, y1, w1, x2, y2, w2, color) {
      const leftGrass1 = x1 - w1 * 1.55;
      const rightGrass1 = x1 + w1 * 1.55;
      const leftGrass2 = x2 - w2 * 1.55;
      const rightGrass2 = x2 + w2 * 1.55;

      ctx.fillStyle = color.grass;
      ctx.beginPath();
      ctx.moveTo(leftGrass1, y1);
      ctx.lineTo(rightGrass1, y1);
      ctx.lineTo(rightGrass2, y2);
      ctx.lineTo(leftGrass2, y2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = color.rumble;
      ctx.beginPath();
      ctx.moveTo(x1 - w1 * 1.08, y1);
      ctx.lineTo(x1 - w1, y1);
      ctx.lineTo(x2 - w2, y2);
      ctx.lineTo(x2 - w2 * 1.08, y2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x1 + w1, y1);
      ctx.lineTo(x1 + w1 * 1.08, y1);
      ctx.lineTo(x2 + w2 * 1.08, y2);
      ctx.lineTo(x2 + w2, y2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = color.road;
      ctx.beginPath();
      ctx.moveTo(x1 - w1, y1);
      ctx.lineTo(x1 + w1, y1);
      ctx.lineTo(x2 + w2, y2);
      ctx.lineTo(x2 - w2, y2);
      ctx.closePath();
      ctx.fill();

      if (color.lane) {
        const laneW1 = (w1 * 2) / world.laneCount;
        const laneW2 = (w2 * 2) / world.laneCount;
        for (let lane = 1; lane < world.laneCount; lane++) {
          const laneX1 = x1 - w1 + laneW1 * lane;
          const laneX2 = x2 - w2 + laneW2 * lane;
          ctx.strokeStyle = color.lane;
          ctx.lineWidth = Math.max(1, w1 * 0.03);
          ctx.beginPath();
          ctx.moveTo(laneX1, y1);
          ctx.lineTo(laneX2, y2);
          ctx.stroke();
        }
      }
    }

    function drawRoad() {
      const baseSegment = findSegment(car.z);
      drawBackground(baseSegment);

      const cameraX = car.x * world.roadWidth;
      const cameraY = 980 + findSegment(car.z).y;
      const cameraZ = car.z;

      let x = 0;
      let dx = 0;
      let maxY = canvas.height;
      const rendered = [];

      for (let n = 0; n < world.drawDistance; n++) {
        const seg = state.segments[(baseSegment.index + n) % state.segments.length];
        const segLooped = seg.index < baseSegment.index;
        const z1 = n * world.segmentLength;
        const z2 = (n + 1) * world.segmentLength;

        const p1 = project(
          x,
          seg.y,
          z1 + (segLooped ? trackLength() : 0),
          cameraX,
          cameraY,
          cameraZ
        );

        x += dx;
        dx += seg.curve;

        const next = state.segments[(seg.index + 1) % state.segments.length];
        const p2 = project(
          x,
          next.y,
          z2 + (segLooped ? trackLength() : 0),
          cameraX,
          cameraY,
          cameraZ
        );

        if (p1.y >= maxY || p2.y >= maxY) {
          continue;
        }

        const dark = Math.floor(seg.index / world.rumbleLength) % 2 === 0;
        drawSegment(
          p1.x,
          p1.y,
          p1.w,
          p2.x,
          p2.y,
          p2.w,
          {
            grass: dark ? '#ae8248' : '#c9975e',
            rumble: dark ? '#f7f7f7' : '#cf2f2f',
            road: dark ? '#555b63' : '#4c5258',
            lane: dark ? '#f4f4f4' : null
          }
        );

        maxY = p2.y;
        rendered.push({ seg, p1, p2 });
      }

      drawSprites(rendered, cameraX, cameraY, cameraZ);
      drawCockpit();
    }

    function drawSprites(rendered, cameraX, cameraY, cameraZ) {
      for (const npc of state.opponents) {
        let relativeZ = npc.z - car.z;
        while (relativeZ < 0) relativeZ += trackLength();

        if (relativeZ > world.drawDistance * world.segmentLength) continue;

        const proj = project(
          npc.x * world.roadWidth,
          0,
          relativeZ,
          cameraX,
          cameraY,
          cameraZ
        );

        if (proj.y > canvas.height || proj.y < world.horizonY - 10) continue;

        const carW = Math.max(8, proj.w * 0.22);
        const carH = carW * 0.7;

        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(proj.x, proj.y + carH * 0.5, carW * 0.8, carH * 0.33, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = npc.color;
        ctx.fillRect(proj.x - carW / 2, proj.y - carH, carW, carH);
        ctx.fillStyle = '#181818';
        ctx.fillRect(proj.x - carW * 0.36, proj.y - carH * 0.6, carW * 0.72, carH * 0.2);
      }
    }

    function drawCockpit() {
      const y = canvas.height - 165;
      ctx.fillStyle = '#2c2c34';
      ctx.fillRect(0, y, canvas.width, 165);

      const grad = ctx.createLinearGradient(0, y, 0, canvas.height);
      grad.addColorStop(0, '#646d7a');
      grad.addColorStop(1, '#232630');
      ctx.fillStyle = grad;
      ctx.fillRect(0, y + 16, canvas.width, 149);

      ctx.strokeStyle = '#f1ca3d';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, y + 2);
      ctx.lineTo(canvas.width, y + 2);
      ctx.stroke();

      const speedPct = car.speed / car.maxSpeed;
      ctx.fillStyle = '#0f1115';
      ctx.fillRect(42, y + 30, 225, 96);
      ctx.strokeStyle = '#9ea4b4';
      ctx.lineWidth = 3;
      ctx.strokeRect(42, y + 30, 225, 96);

      ctx.fillStyle = '#f2f2f2';
      ctx.font = '22px Trebuchet MS';
      ctx.fillText('MPH', 58, y + 66);
      ctx.fillStyle = '#ff4d5a';
      ctx.fillRect(58, y + 82, 180 * speedPct, 18);

      const wheelX = canvas.width * 0.5 + car.x * 80;
      const wheelY = y + 96;
      ctx.strokeStyle = '#8f939d';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(wheelX, wheelY, 82, Math.PI * 0.2, Math.PI * 1.8);
      ctx.stroke();

      ctx.strokeStyle = '#c8ccd8';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(wheelX, wheelY);
      ctx.lineTo(wheelX + Math.sin(car.x * 1.9) * 58, wheelY - 40);
      ctx.stroke();
    }

    function update(dt) {
      if (car.crashed) return;

      const key = (k) => state.keys.has(k);
      const accelInput = key('ArrowUp') || key('w') || key('W');
      const brakeInput = key('ArrowDown') || key('s') || key('S');
      const leftInput = key('ArrowLeft') || key('a') || key('A');
      const rightInput = key('ArrowRight') || key('d') || key('D');
      const handbrake = key(' ');

      if (accelInput) car.speed += car.accel * dt;
      else car.speed -= car.friction * dt;

      if (brakeInput) car.speed -= car.braking * dt;
      if (handbrake) car.speed -= car.braking * 0.85 * dt;

      car.speed = Math.max(0, Math.min(car.maxSpeed, car.speed));

      const speedPercent = car.speed / car.maxSpeed;
      const curve = findSegment(car.z).curve;

      if (leftInput) car.x -= car.steerStrength * speedPercent * dt;
      if (rightInput) car.x += car.steerStrength * speedPercent * dt;

      car.x -= curve * speedPercent * 1.2 * dt;
      if (Math.abs(car.x) > 1.05) car.speed -= car.offroadDrag * dt;
      car.x = Math.max(-1.4, Math.min(1.4, car.x));

      car.z += car.speed * world.segmentLength * 0.06 * dt;
      state.distance += car.speed * dt * 0.00042;

      const length = trackLength();
      if (car.z >= length) car.z -= length;

      for (const npc of state.opponents) {
        npc.z += npc.speed * world.segmentLength * 0.05 * dt;
        if (npc.z > length) npc.z -= length;

        let dz = npc.z - car.z;
        if (dz < 0) dz += length;

        if (dz < 850 && dz > 20 && Math.abs(npc.x - car.x) < 0.18) {
          car.crashed = true;
          car.speed = 0;
          crashScreen.classList.add('visible');
        }
      }

      speedEl.textContent = Math.round(car.speed);
      distanceEl.textContent = state.distance.toFixed(1);
      curveEl.textContent = curve.toFixed(2);
    }

    function frame(t) {
      const dt = Math.min(0.032, (t - state.time) / 1000 || 0.016);
      state.time = t;

      update(dt);
      drawRoad();
      requestAnimationFrame(frame);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r' && car.crashed) {
        resetGame();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      state.keys.add(e.key);
    });

    window.addEventListener('keyup', (e) => {
      state.keys.delete(e.key);
    });

    resetGame();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
