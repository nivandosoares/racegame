<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Drive II - Mode 7 Prototype</title>
  <style>
    :root {
      --text: #f2f2f2;
      --accent: #f5cf40;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 10%, #1f2f57 0%, #11182f 45%, #080b14 100%);
      color: var(--text);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .game-shell {
      width: min(100vw, 1024px);
      aspect-ratio: 4 / 3;
      background: linear-gradient(180deg, #202a45 0%, #111726 100%);
      border: 4px solid #303c61;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #87b8ff;
    }

    .overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.7);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      font-size: clamp(12px, 2vw, 20px);
      letter-spacing: 1px;
    }

    .hud-chip {
      background: rgba(4, 6, 12, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
    }

    .help {
      font-size: clamp(10px, 1.5vw, 16px);
      color: #ddd;
      opacity: 0.92;
      background: rgba(4, 6, 12, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      max-width: 65%;
    }

    .crash {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(5, 5, 8, 0.72);
      color: white;
      text-align: center;
      padding: 20px;
      font-size: clamp(18px, 2.6vw, 34px);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .crash.visible { display: grid; }

    .crash small {
      display: block;
      margin-top: 10px;
      color: var(--accent);
      font-size: 0.45em;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="720" aria-label="Mode 7 racing prototype"></canvas>

    <div class="overlay">
      <div class="hud-row">
        <div class="hud-chip">Speed: <span id="speed">0</span> mph</div>
        <div class="hud-chip">Distance: <span id="distance">0.0</span> mi</div>
        <div class="hud-chip">Curve: <span id="curve">0.00</span></div>
      </div>
      <div class="help">Arrows / A-D steer, W-S throttle and brake, Space handbrake. Stay on road and avoid traffic. R to restart after crash.</div>
    </div>

    <div id="crashScreen" class="crash">
      CRASHED
      <small>Press R to restart</small>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const speedEl = document.getElementById('speed');
    const distanceEl = document.getElementById('distance');
    const curveEl = document.getElementById('curve');
    const crashScreen = document.getElementById('crashScreen');

    const world = {
      width: canvas.width,
      height: canvas.height,
      roadWidth: 1800,
      segmentLength: 220,
      rumbleLength: 3,
      laneCount: 2,
      cameraHeight: 1050,
      drawDistance: 280,
      fieldOfView: 95,
      horizon: canvas.height * 0.43
    };
    world.cameraDepth = 1 / Math.tan((world.fieldOfView * 0.5) * Math.PI / 180);
    world.playerZ = world.cameraHeight * world.cameraDepth;

    const car = {
      x: 0,
      position: 0,
      speed: 0,
      maxSpeed: world.segmentLength * 2.7,
      accel: world.segmentLength * 0.95,
      brake: world.segmentLength * 1.8,
      decel: world.segmentLength * 0.5,
      offRoadDecel: world.segmentLength * 1.25,
      offRoadLimit: world.segmentLength * 0.72,
      steerRate: 2.6,
      crashed: false
    };

    const state = {
      time: 0,
      distanceMiles: 0,
      keys: new Set(),
      segments: [],
      opponents: []
    };

    const colors = {
      skyTop: '#2f64d6',
      skyBottom: '#97bcff',
      hillDark: '#7a4f2d',
      hillLight: '#9f6a3d',
      roadLight: '#5c636a',
      roadDark: '#4f565d',
      lane: '#f4f4f2',
      rumbleLight: '#f8f8f8',
      rumbleDark: '#d53838',
      sandLight: '#d3a56c',
      sandDark: '#c38d54'
    };

    const lastY = () => (state.segments.length === 0 ? 0 : state.segments[state.segments.length - 1].p2.world.y);
    const easeIn = (a, b, p) => a + (b - a) * (p * p);
    const easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const accelerate = (v, accel, dt) => v + (accel * dt);
    const increase = (start, increment, max) => {
      let result = start + increment;
      while (result >= max) result -= max;
      while (result < 0) result += max;
      return result;
    };

    function addSegment(curve, y) {
      const n = state.segments.length;
      state.segments.push({
        index: n,
        curve,
        p1: { world: { y: lastY(), z: n * world.segmentLength }, camera: {}, screen: {} },
        p2: { world: { y, z: (n + 1) * world.segmentLength }, camera: {}, screen: {} }
      });
    }

    function addRoad(enter, hold, leave, curve, hill) {
      const startY = lastY();
      const endY = startY + (hill * world.segmentLength);
      const total = enter + hold + leave;

      for (let i = 0; i < enter; i++) addSegment(easeIn(0, curve, i / Math.max(1, enter)), easeInOut(startY, endY, i / total));
      for (let i = 0; i < hold; i++) addSegment(curve, easeInOut(startY, endY, (enter + i) / total));
      for (let i = 0; i < leave; i++) addSegment(easeInOut(curve, 0, i / Math.max(1, leave)), easeInOut(startY, endY, (enter + hold + i) / total));
    }

    function buildTrack() {
      state.segments = [];
      addRoad(30, 80, 30, 0, 0);
      addRoad(25, 90, 25, 0.8, 0);
      addRoad(30, 70, 30, 1.15, 0.65);
      addRoad(25, 80, 25, -1.1, -0.2);
      addRoad(30, 65, 30, -0.85, -0.5);
      addRoad(20, 80, 20, 0.55, 0.4);
      addRoad(25, 100, 25, 0, -0.75);
      addRoad(20, 70, 20, -0.35, 0.15);
    }

    function trackLength() {
      return state.segments.length * world.segmentLength;
    }

    function findSegment(z) {
      return state.segments[Math.floor(z / world.segmentLength) % state.segments.length];
    }

    function percentRemaining(n, total) {
      return (n % total) / total;
    }

    function interpolate(a, b, p) {
      return a + (b - a) * p;
    }

    function project(point, cameraX, cameraY, cameraZ) {
      point.camera.x = point.world.x - cameraX;
      point.camera.y = point.world.y - cameraY;
      point.camera.z = point.world.z - cameraZ;
      point.screen.scale = world.cameraDepth / point.camera.z;
      point.screen.x = Math.round((world.width / 2) + (point.screen.scale * point.camera.x * world.width / 2));
      point.screen.y = Math.round((world.height / 2) - (point.screen.scale * point.camera.y * world.height / 2));
      point.screen.w = Math.round(point.screen.scale * world.roadWidth * world.width / 2);
    }

    function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function drawSegment(segment) {
      const x1 = segment.p1.screen.x;
      const y1 = segment.p1.screen.y;
      const w1 = segment.p1.screen.w;
      const x2 = segment.p2.screen.x;
      const y2 = segment.p2.screen.y;
      const w2 = segment.p2.screen.w;

      const dark = Math.floor(segment.index / world.rumbleLength) % 2;
      const roadColor = dark ? colors.roadDark : colors.roadLight;
      const rumbleColor = dark ? colors.rumbleDark : colors.rumbleLight;
      const sandColor = dark ? colors.sandDark : colors.sandLight;
      const laneColor = dark ? null : colors.lane;

      drawPolygon(0, y2, world.width, y2, world.width, y1, 0, y1, sandColor);
      drawPolygon(x1 - w1 * 1.08, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 * 1.08, y2, rumbleColor);
      drawPolygon(x1 + w1, y1, x1 + w1 * 1.08, y1, x2 + w2 * 1.08, y2, x2 + w2, y2, rumbleColor);
      drawPolygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, roadColor);

      if (laneColor) {
        const laneW1 = (w1 * 2) / world.laneCount;
        const laneW2 = (w2 * 2) / world.laneCount;
        for (let lane = 1; lane < world.laneCount; lane++) {
          const lanex1 = x1 - w1 + lane * laneW1;
          const lanex2 = x2 - w2 + lane * laneW2;
          drawPolygon(lanex1 - w1 * 0.02, y1, lanex1 + w1 * 0.02, y1, lanex2 + w2 * 0.02, y2, lanex2 - w2 * 0.02, y2, laneColor);
        }
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, world.horizon);
      sky.addColorStop(0, colors.skyTop);
      sky.addColorStop(1, colors.skyBottom);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, world.width, world.horizon + 40);

      const wave = Math.sin(state.time * 0.00025 + car.position * 0.00003) * 26;
      ctx.fillStyle = colors.hillDark;
      ctx.beginPath();
      ctx.moveTo(0, world.horizon + 28);
      for (let x = 0; x <= world.width; x += 36) {
        ctx.lineTo(x, world.horizon + 52 + Math.sin(x * 0.014 + wave) * 24);
      }
      ctx.lineTo(world.width, world.horizon + 170);
      ctx.lineTo(0, world.horizon + 170);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = colors.hillLight;
      ctx.beginPath();
      ctx.moveTo(0, world.horizon + 46);
      for (let x = 0; x <= world.width; x += 42) {
        ctx.lineTo(x, world.horizon + 74 + Math.sin(x * 0.011 + wave * 0.6) * 18);
      }
      ctx.lineTo(world.width, world.horizon + 168);
      ctx.lineTo(0, world.horizon + 168);
      ctx.closePath();
      ctx.fill();
    }

    function seedTraffic() {
      state.opponents = [];
      for (let i = 0; i < 20; i++) {
        state.opponents.push({
          z: (i * 14 + 18) * world.segmentLength,
          offset: (Math.random() * 1.5) - 0.75,
          speed: car.maxSpeed * (0.34 + Math.random() * 0.35),
          color: `hsl(${Math.floor(Math.random() * 120 + 20)}, 70%, 56%)`
        });
      }
    }

    function drawTraffic(visibleSegments) {
      const data = [];
      const total = trackLength();

      for (const npc of state.opponents) {
        let dz = npc.z - car.position;
        if (dz < 0) dz += total;
        if (dz <= 0 || dz > world.drawDistance * world.segmentLength) continue;

        const rel = Math.floor(dz / world.segmentLength);
        const seg = visibleSegments[rel];
        if (!seg) continue;

        const percent = percentRemaining(npc.z, world.segmentLength);
        const x = interpolate(seg.p1.screen.x, seg.p2.screen.x, percent);
        const y = interpolate(seg.p1.screen.y, seg.p2.screen.y, percent);
        const w = interpolate(seg.p1.screen.w, seg.p2.screen.w, percent);

        data.push({
          rel,
          x: x + (w * npc.offset),
          y,
          size: Math.max(8, w * 0.18),
          color: npc.color
        });
      }

      data.sort((a, b) => b.rel - a.rel);

      for (const sprite of data) {
        const w = sprite.size;
        const h = w * 0.68;
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath();
        ctx.ellipse(sprite.x, sprite.y + h * 0.45, w * 0.7, h * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = sprite.color;
        ctx.fillRect(sprite.x - w * 0.5, sprite.y - h, w, h);
        ctx.fillStyle = '#1d1f27';
        ctx.fillRect(sprite.x - w * 0.38, sprite.y - h * 0.62, w * 0.76, h * 0.24);
      }
    }

    function drawCockpit() {
      const y = world.height - 165;
      ctx.fillStyle = '#2c2c34';
      ctx.fillRect(0, y, world.width, 165);

      const grad = ctx.createLinearGradient(0, y, 0, world.height);
      grad.addColorStop(0, '#646d7a');
      grad.addColorStop(1, '#232630');
      ctx.fillStyle = grad;
      ctx.fillRect(0, y + 16, world.width, 149);

      ctx.strokeStyle = '#f1ca3d';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, y + 2);
      ctx.lineTo(world.width, y + 2);
      ctx.stroke();

      const speedPct = car.speed / car.maxSpeed;
      ctx.fillStyle = '#0f1115';
      ctx.fillRect(42, y + 30, 225, 96);
      ctx.strokeStyle = '#9ea4b4';
      ctx.lineWidth = 3;
      ctx.strokeRect(42, y + 30, 225, 96);

      ctx.fillStyle = '#f2f2f2';
      ctx.font = '22px Trebuchet MS';
      ctx.fillText('MPH', 58, y + 66);
      ctx.fillStyle = '#ff4d5a';
      ctx.fillRect(58, y + 82, 180 * speedPct, 18);

      const wheelX = world.width * 0.5 + car.x * 90;
      const wheelY = y + 96;
      ctx.strokeStyle = '#8f939d';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(wheelX, wheelY, 82, Math.PI * 0.2, Math.PI * 1.8);
      ctx.stroke();

      ctx.strokeStyle = '#c8ccd8';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(wheelX, wheelY);
      ctx.lineTo(wheelX + Math.sin(car.x * 1.9) * 58, wheelY - 40);
      ctx.stroke();
    }

    function render() {
      drawBackground();

      const baseSegment = findSegment(car.position);
      const basePercent = percentRemaining(car.position, world.segmentLength);
      const playerSegment = findSegment(car.position + world.playerZ);
      const playerPercent = percentRemaining(car.position + world.playerZ, world.segmentLength);
      const playerY = interpolate(playerSegment.p1.world.y, playerSegment.p2.world.y, playerPercent);

      const maxyStart = world.height;
      let maxy = maxyStart;
      let x = 0;
      let dx = -(baseSegment.curve * basePercent);
      const visibleSegments = [];

      for (let n = 0; n < world.drawDistance; n++) {
        const segment = state.segments[(baseSegment.index + n) % state.segments.length];
        segment.looped = segment.index < baseSegment.index;

        segment.p1.world.x = x;
        segment.p2.world.x = x + dx;

        project(
          segment.p1,
          (car.x * world.roadWidth) - x,
          playerY + world.cameraHeight,
          car.position - (segment.looped ? trackLength() : 0)
        );

        project(
          segment.p2,
          (car.x * world.roadWidth) - x - dx,
          playerY + world.cameraHeight,
          car.position - (segment.looped ? trackLength() : 0)
        );

        x += dx;
        dx += segment.curve;

        if (segment.p1.camera.z <= world.cameraDepth || segment.p2.screen.y >= maxy) continue;

        drawSegment(segment);
        maxy = segment.p2.screen.y;
        visibleSegments[n] = segment;
      }

      drawTraffic(visibleSegments);
      drawCockpit();
    }

    function updateTraffic(dt) {
      const total = trackLength();
      for (const npc of state.opponents) {
        npc.z = increase(npc.z, dt * npc.speed, total);
        npc.offset += Math.sin((npc.z + state.time * 0.1) * 0.0008) * dt * 0.12;
        npc.offset = clamp(npc.offset, -0.85, 0.85);

        let dz = npc.z - car.position;
        if (dz < 0) dz += total;
        if (dz > 0 && dz < world.segmentLength * 1.25 && Math.abs(npc.offset - car.x) < 0.22 && car.speed > npc.speed * 0.55) {
          car.crashed = true;
          car.speed = 0;
          crashScreen.classList.add('visible');
        }
      }
    }

    function updateCar(dt) {
      if (car.crashed) return;

      const has = (key) => state.keys.has(key);
      const gas = has('ArrowUp') || has('w') || has('W');
      const brake = has('ArrowDown') || has('s') || has('S');
      const left = has('ArrowLeft') || has('a') || has('A');
      const right = has('ArrowRight') || has('d') || has('D');
      const handbrake = has(' ');

      if (gas) car.speed = accelerate(car.speed, car.accel, dt);
      else if (car.speed > 0) car.speed = accelerate(car.speed, -car.decel, dt);

      if (brake) car.speed = accelerate(car.speed, -car.brake, dt);
      if (handbrake) car.speed = accelerate(car.speed, -car.brake * 0.8, dt);

      car.speed = clamp(car.speed, 0, car.maxSpeed);
      const speedPercent = car.speed / car.maxSpeed;
      const steerAmount = dt * car.steerRate * speedPercent;

      if (left) car.x -= steerAmount;
      if (right) car.x += steerAmount;

      const playerSegment = findSegment(car.position + world.playerZ);
      car.x -= steerAmount * playerSegment.curve * 1.8;

      if ((car.x < -1 || car.x > 1) && car.speed > car.offRoadLimit) {
        car.speed = accelerate(car.speed, -car.offRoadDecel, dt);
      }

      car.x = clamp(car.x, -1.6, 1.6);
      car.position = increase(car.position, dt * car.speed, trackLength());
      state.distanceMiles += (car.speed * dt) / 14000;

      speedEl.textContent = Math.round((car.speed / car.maxSpeed) * 190 + speedPercent * 45);
      distanceEl.textContent = state.distanceMiles.toFixed(1);
      curveEl.textContent = playerSegment.curve.toFixed(2);
    }

    function resetGame() {
      buildTrack();
      seedTraffic();
      car.x = 0;
      car.position = 0;
      car.speed = 0;
      car.crashed = false;
      state.distanceMiles = 0;
      crashScreen.classList.remove('visible');
    }

    function tick(now) {
      const dt = Math.min(0.033, ((now - state.time) || 16) / 1000);
      state.time = now;

      updateCar(dt);
      updateTraffic(dt);
      render();
      requestAnimationFrame(tick);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r' && car.crashed) resetGame();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      state.keys.add(e.key);
    });

    window.addEventListener('keyup', (e) => state.keys.delete(e.key));

    resetGame();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
